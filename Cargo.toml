[package]
name = "retrospect-slint"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
slint-build = { path = "../slint-fork/slint-fork-master/api/rs/build", features = ["experimental-module-builds"] }

[dependencies]
canvas-core = { path = "../packages/backend/canvas-core" }
retrospect-node-contracts = { path = "../packages/backend/retrospect-node-contracts" }
planner-core = { path = "../packages/backend/planner-core" }
ui-kit-slint = { path = "../packages/frontend/ui-kit-slint" }
lattice-slint = { path = "../packages/frontend/lattice-slint" }
document-core = { path = "../packages/backend/todoco-document-engine/document-core" }
document-layout = { path = "../packages/backend/todoco-document-engine/document-layout" }
document-codecs = { path = "../packages/backend/todoco-document-engine/document-codecs" }
document-retrieval = { path = "../packages/backend/todoco-document-engine/document-retrieval" }
execution-workspace = { path = "../packages/backend/execution-workspace", features = ["agentfs"] }
agent-execution-lane = { path = "../packages/sci-fi-system/agent-execution-lane" }
agent-auth = { path = "../packages/sci-fi-system/agent-auth" }
retrospect-runtime-contracts = { path = "../packages/sci-fi-system/retrospect-runtime-contracts" }
retrospect-persistence-contracts = { path = "../packages/sci-fi-system/retrospect-persistence-contracts" }
retrospect-persistence-authority = { path = "../packages/sci-fi-system/retrospect-persistence-authority" }
agentfs-sdk = { path = "../packages/sci-fi-system/agentfs-sdk" }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
rfd = "0.17"
notify = "6.1"
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Slint's pinned wgpu-29 dependency disables default features; enable WGSL so
# the public `slint::wgpu_29` shader-source API includes the WGSL variant.
wgpu-29 = { package = "wgpu", version = "29.0.4", default-features = false, features = ["wgsl"] }
# WGPU is preferred so native glass panels can sample the live Slint scene.
# OpenGL remains compiled as a manual fill-only troubleshooting fallback via
# `SLINT_BACKEND=femtovg`.
slint = { path = "../slint-fork/slint-fork-master/api/rs/slint", features = ["backend-winit", "renderer-femtovg", "renderer-femtovg-wgpu", "unstable-wgpu-29", "unstable-winit-030"] }

[dev-dependencies]
tempfile = "3"

# Keep transitive consumers such as ui-kit-slint on the same fork during the
# local spike. Remove these patches when dependencies move to the pinned
# private Slint fork commit.
[patch.crates-io]
slint = { path = "../slint-fork/slint-fork-master/api/rs/slint" }
slint-build = { path = "../slint-fork/slint-fork-master/api/rs/build" }
